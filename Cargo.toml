[workspace]
resolver = "2"
members = ["crates/tuf-core", "crates/tuf-hal", "crates/tuf-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.29", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }

[profile.release]
lto = "thin"
